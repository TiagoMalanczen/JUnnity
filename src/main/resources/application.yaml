spring:
  application:
    name: fleetlog
  datasource:
    url: jdbc:mysql://localhost:3306/fleetlog?createDatabaseIfNotExist=true
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
